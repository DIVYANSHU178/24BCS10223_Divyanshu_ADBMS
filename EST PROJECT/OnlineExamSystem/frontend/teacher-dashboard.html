<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard - Online Exam System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --primary-glow: rgba(79, 70, 229, 0.25);
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748b;
            --slate-400: #94a3b8;
            --slate-200: #e2e8f0;
            --slate-100: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(79, 70, 229, 0.14) 0%, transparent 50%),
                        #0b0f19;
            color: #f8fafc;
            padding: 1.5rem;
        }

        /* Top Navigation Header */
        .navbar {
            max-width: 1240px;
            margin: 0 auto 2rem;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.4s ease;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 6px 16px -3px var(--primary-glow);
        }

        .nav-title h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .nav-title span {
            font-size: 0.8rem;
            color: var(--slate-400);
            display: block;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
            color: #e2e8f0;
        }

        .btn-nav {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-ghost {
            background: transparent;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #ffffff;
        }

        /* Main Grid Layout */
        .main-container {
            max-width: 1240px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.45fr 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Glass Cards */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 1.8rem;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.4rem;
            padding-bottom: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card-header h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header .badge {
            font-size: 0.72rem;
            padding: 3px 10px;
            border-radius: 9999px;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
            font-weight: 600;
        }

        /* Form elements */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }

        .form-row.three-col {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 9px 12px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.85);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        select option {
            background: #1e293b;
            color: #ffffff;
        }

        /* Dynamic Questions Builder */
        .questions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.4rem 0 1rem;
        }

        .btn-add-q {
            background: rgba(99, 102, 241, 0.18);
            color: #a5b4fc;
            border: 1px dashed rgba(99, 102, 241, 0.4);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-add-q:hover {
            background: rgba(99, 102, 241, 0.3);
            color: #ffffff;
            border-style: solid;
        }

        .question-item {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        .q-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .q-badge {
            font-size: 0.78rem;
            font-weight: 700;
            color: #818cf8;
        }

        .btn-remove-q {
            background: transparent;
            color: #ef4444;
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .btn-remove-q:hover {
            background: rgba(239, 68, 68, 0.15);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .option-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 4px 10px;
        }

        .option-input-wrapper.is-correct-wrapper {
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.08);
        }

        .option-input-wrapper input[type="radio"] {
            accent-color: #10b981;
            cursor: pointer;
        }

        .option-input-wrapper input[type="text"] {
            border: none;
            background: transparent;
            padding: 6px 0;
            box-shadow: none;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 20px -5px var(--primary-glow);
            transition: all 0.2s;
            margin-top: 14px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            box-shadow: 0 14px 25px -4px var(--primary-glow);
        }

        /* Subjects list pills */
        .subjects-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .subject-tag {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #c7d2fe;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .subject-tag span.code {
            color: #818cf8;
            font-weight: 700;
            font-size: 0.72rem;
            background: rgba(15, 23, 42, 0.6);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Analytics Display Card */
        .analytics-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 16px;
        }

        .metric-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s;
        }
        .metric-box:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .metric-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .icon-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .icon-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .icon-emerald { background: rgba(16, 185, 129, 0.15); color: #34d399; }

        .metric-value {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--slate-400);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 600;
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            min-width: 300px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 0.88rem;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            border-left: 4px solid var(--primary);
            animation: slideIn 0.3s forwards;
        }

        .toast.toast-success { border-left-color: var(--success); }
        .toast.toast-error { border-left-color: var(--danger); }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">
            <div class="brand-badge">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <div class="nav-title">
                <h2>Faculty Examination Studio</h2>
                <span id="facultySub">Enterprise Assessment Suite</span>
            </div>
        </div>

        <div class="nav-actions">
            <div class="user-pill" id="userPill">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span id="userName">Faculty Member</span>
            </div>
            <a href="leaderboard.html" class="btn-nav btn-ghost">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                </svg>
                Leaderboard
            </a>
            <button onclick="logout()" class="btn-nav btn-logout">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Logout
            </button>
        </div>
    </nav>

    <!-- Main Workspace -->
    <div class="main-container">
        <!-- LEFT COLUMN: Create Exam with Dynamic Multiple Questions -->
        <div class="left-col">
            <div class="glass-card">
                <div class="card-header">
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="12" y1="18" x2="12" y2="12"/>
                            <line x1="9" y1="15" x2="15" y2="15"/>
                        </svg>
                        Design New Examination
                    </h3>
                    <span class="badge">Dynamic Q&A</span>
                </div>

                <form id="createExamForm" onsubmit="handleCreateExam(event)">
                    <div class="form-group">
                        <label for="examTitle">Exam Title</label>
                        <input type="text" id="examTitle" placeholder="e.g., Advanced Database Transactions & Concurrency" required>
                    </div>

                    <div class="form-group">
                        <label for="examDesc">Description</label>
                        <textarea id="examDesc" placeholder="Brief outline of concepts tested..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="examSubjectSelect">Subject</label>
                            <select id="examSubjectSelect" required>
                                <option value="" disabled selected>Select Subject...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="examDifficulty">Difficulty Level</label>
                            <select id="examDifficulty">
                                <option value="Easy">🟢 Easy</option>
                                <option value="Medium" selected>🟡 Medium</option>
                                <option value="Hard">🔴 Hard</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row three-col">
                        <div class="form-group">
                            <label for="durationMin">Duration (Mins)</label>
                            <input type="number" id="durationMin" min="1" max="300" value="30" required>
                        </div>
                        <div class="form-group">
                            <label for="passMark">Pass Mark (%)</label>
                            <input type="number" id="passMark" min="0" max="100" value="40" required>
                        </div>
                        <div class="form-group">
                            <label for="totalMarks">Total Marks</label>
                            <input type="number" id="totalMarks" min="1" value="5" required>
                        </div>
                    </div>

                    <!-- Dynamic Questions Container -->
                    <div class="questions-header">
                        <label style="font-size: 0.88rem; font-weight:700; color:#e2e8f0;">
                            Exam Questions (<span id="questionCountDisplay">1</span>)
                        </label>
                        <button type="button" class="btn-add-q" onclick="addQuestionItem()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            + Add Question
                        </button>
                    </div>

                    <div id="questionsList">
                        <!-- Questions dynamically injected here -->
                    </div>

                    <button type="submit" class="btn-primary" id="publishBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        Publish Exam to Portal
                    </button>
                </form>
            </div>
        </div>

        <!-- RIGHT COLUMN: Subject Management & MySQL Stored Procedure Analytics -->
        <div class="right-col">
            <!-- 1. Quick Add Subject Form -->
            <div class="glass-card">
                <div class="card-header">
                    <h3>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                        Manage Subjects
                    </h3>
                    <span class="badge" id="subjectBadgeCount">0 Active</span>
                </div>

                <form id="addSubjectForm" onsubmit="handleAddSubject(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="newSubjectName">Subject Name</label>
                            <input type="text" id="newSubjectName" placeholder="e.g. Distributed Systems" required>
                        </div>
                        <div class="form-group">
                            <label for="newSubjectCode">Code (Optional)</label>
                            <input type="text" id="newSubjectCode" placeholder="e.g. CS401">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" style="margin-top: 0; background: linear-gradient(135deg, #3b82f6, #2563eb);">
                        + Add Subject
                    </button>
                </form>

                <div style="margin-top: 14px;">
                    <label style="font-size:0.75rem; color:var(--slate-400); text-transform:uppercase; font-weight:600;">Registered Subjects</label>
                    <div class="subjects-tags" id="subjectTagsContainer">
                        <!-- Rendered via JS -->
                    </div>
                </div>
            </div>

            <!-- 2. Stored Procedure Analytics -->
            <div class="glass-card">
                <div class="card-header">
                    <h3>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                        Exam Analytics (Stored Proc)
                    </h3>
                    <span class="badge" style="background:rgba(16,185,129,0.15); color:#6ee7b7; border-color:rgba(16,185,129,0.3);">
                        CALL GetExamAnalytics
                    </span>
                </div>

                <div class="form-group">
                    <label for="analyticsSelect">Select Exam to Inspect</label>
                    <select id="analyticsSelect" onchange="loadAnalytics()"></select>
                </div>

                <div id="analyticsDisplay" class="analytics-metrics">
                    <div class="metric-box">
                        <div class="metric-icon icon-blue">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                        </div>
                        <div>
                            <div class="metric-value" id="valAttempts">0</div>
                            <div class="metric-label">Attempts</div>
                        </div>
                    </div>

                    <div class="metric-box">
                        <div class="metric-icon icon-purple">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                            </svg>
                        </div>
                        <div>
                            <div class="metric-value" id="valAvg">0.00</div>
                            <div class="metric-label">Average Score</div>
                        </div>
                    </div>

                    <div class="metric-box">
                        <div class="metric-icon icon-amber">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                            </svg>
                        </div>
                        <div>
                            <div class="metric-value" id="valMax">0.00</div>
                            <div class="metric-label">Highest Score</div>
                        </div>
                    </div>

                    <div class="metric-box">
                        <div class="metric-icon icon-emerald">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                <polyline points="22 4 12 14.01 9 11.01"/>
                            </svg>
                        </div>
                        <div>
                            <div class="metric-value" id="valPass">0</div>
                            <div class="metric-label">Passed</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = "http://localhost:8080/api";
        const user = JSON.parse(localStorage.getItem("examUser"));
        if (!user || (user.role !== "teacher" && user.role !== "admin")) {
            window.location.href = "login.html";
        }

        document.getElementById("userName").textContent = user ? user.name : "Faculty Member";

        let subjectsCache = [];
        let examsCache = [];
        let questionCounter = 0;

        function showToast(message, type = "info") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function logout() {
            localStorage.removeItem("examUser");
            window.location.href = "login.html";
        }

        // Initialize page
        window.onload = async () => {
            await loadSubjects();
            await loadExams();
            // Start with 1 question
            addQuestionItem();
        };

        async function loadSubjects() {
            try {
                const res = await fetch(`${API}/subjects`);
                const data = await res.json();
                if (data.success) {
                    subjectsCache = data.subjects || [];
                    renderSubjectDropdown();
                    renderSubjectTags();
                }
            } catch (err) {
                showToast("Failed to fetch subjects.", "error");
            }
        }

        function renderSubjectDropdown() {
            const sel = document.getElementById("examSubjectSelect");
            sel.innerHTML = '<option value="" disabled selected>Select Subject...</option>';
            subjectsCache.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s.subject_id;
                opt.textContent = `${s.subject_name} ${s.subject_code ? '(' + s.subject_code + ')' : ''}`;
                sel.appendChild(opt);
            });
        }

        function renderSubjectTags() {
            const container = document.getElementById("subjectTagsContainer");
            container.innerHTML = "";
            document.getElementById("subjectBadgeCount").textContent = `${subjectsCache.length} Active`;
            subjectsCache.forEach(s => {
                const tag = document.createElement("div");
                tag.className = "subject-tag";
                tag.innerHTML = `<span>${s.subject_name}</span>${s.subject_code ? `<span class="code">${s.subject_code}</span>` : ''}`;
                container.appendChild(tag);
            });
        }

        async function handleAddSubject(e) {
            e.preventDefault();
            const name = document.getElementById("newSubjectName").value.trim();
            const code = document.getElementById("newSubjectCode").value.trim();
            if (!name) return;

            try {
                const res = await fetch(`${API}/subjects`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ subject_name: name, subject_code: code })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`Subject "${name}" registered successfully!`, "success");
                    document.getElementById("newSubjectName").value = "";
                    document.getElementById("newSubjectCode").value = "";
                    await loadSubjects();
                } else {
                    showToast(data.error || "Failed to create subject.", "error");
                }
            } catch (err) {
                showToast("Server connection error.", "error");
            }
        }

        async function loadExams() {
            try {
                const res = await fetch(`${API}/exams`);
                const data = await res.json();
                if (data.success) {
                    examsCache = data.exams || [];
                    const sel = document.getElementById("analyticsSelect");
                    sel.innerHTML = "";
                    examsCache.forEach(ex => {
                        const opt = document.createElement("option");
                        opt.value = ex.exam_id;
                        opt.textContent = `${ex.title} [${ex.subject_name || 'General'} - ${ex.difficulty || 'Medium'}]`;
                        sel.appendChild(opt);
                    });
                    if (examsCache.length > 0) {
                        loadAnalytics();
                    }
                }
            } catch (err) {
                showToast("Failed to fetch exams.", "error");
            }
        }

        async function loadAnalytics() {
            const examId = document.getElementById("analyticsSelect").value;
            if (!examId) return;

            try {
                const res = await fetch(`${API}/analytics?exam_id=${examId}`);
                const data = await res.json();
                if (data.success && data.analytics) {
                    const a = data.analytics;
                    document.getElementById("valAttempts").textContent = a.total_attempts;
                    document.getElementById("valAvg").textContent = Number(a.avg_score).toFixed(2);
                    document.getElementById("valMax").textContent = Number(a.max_score).toFixed(2);
                    document.getElementById("valPass").textContent = a.pass_count;
                }
            } catch (err) {
                showToast("Error loading analytics.", "error");
            }
        }

        // Dynamic Question Builder
        function addQuestionItem() {
            questionCounter++;
            const qId = questionCounter;
            const container = document.getElementById("questionsList");

            const qDiv = document.createElement("div");
            qDiv.className = "question-item";
            qDiv.id = `qItem_${qId}`;

            qDiv.innerHTML = `
                <div class="q-top-bar">
                    <span class="q-badge">Question #${container.children.length + 1}</span>
                    <button type="button" class="btn-remove-q" onclick="removeQuestionItem(${qId})">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                        Remove
                    </button>
                </div>
                <div class="form-group">
                    <input type="text" class="q-text-input" placeholder="Type question prompt..." required>
                </div>
                <div style="font-size: 0.75rem; color: var(--slate-400); margin-bottom: 4px;">
                    Select the radio button next to the <strong>correct</strong> answer option:
                </div>
                <div class="options-grid">
                    <div class="option-input-wrapper is-correct-wrapper">
                        <input type="radio" name="correct_opt_${qId}" value="0" checked title="Mark as correct answer">
                        <input type="text" class="q-opt-input" placeholder="Option A (Correct default)" required>
                    </div>
                    <div class="option-input-wrapper">
                        <input type="radio" name="correct_opt_${qId}" value="1" title="Mark as correct answer">
                        <input type="text" class="q-opt-input" placeholder="Option B" required>
                    </div>
                    <div class="option-input-wrapper">
                        <input type="radio" name="correct_opt_${qId}" value="2" title="Mark as correct answer">
                        <input type="text" class="q-opt-input" placeholder="Option C" required>
                    </div>
                    <div class="option-input-wrapper">
                        <input type="radio" name="correct_opt_${qId}" value="3" title="Mark as correct answer">
                        <input type="text" class="q-opt-input" placeholder="Option D" required>
                    </div>
                </div>
            `;

            container.appendChild(qDiv);
            updateQuestionBadges();
        }

        function removeQuestionItem(qId) {
            const container = document.getElementById("questionsList");
            if (container.children.length <= 1) {
                showToast("Exam must have at least one question.", "error");
                return;
            }
            const item = document.getElementById(`qItem_${qId}`);
            if (item) item.remove();
            updateQuestionBadges();
        }

        function updateQuestionBadges() {
            const container = document.getElementById("questionsList");
            const items = container.querySelectorAll(".question-item");
            items.forEach((item, idx) => {
                const badge = item.querySelector(".q-badge");
                if (badge) badge.textContent = `Question #${idx + 1}`;
            });
            document.getElementById("questionCountDisplay").textContent = items.length;
        }

        async function handleCreateExam(e) {
            e.preventDefault();
            const btn = document.getElementById("publishBtn");
            const title = document.getElementById("examTitle").value.trim();
            const desc = document.getElementById("examDesc").value.trim();
            const subjectId = parseInt(document.getElementById("examSubjectSelect").value);
            const difficulty = document.getElementById("examDifficulty").value;
            const duration = parseInt(document.getElementById("durationMin").value);
            const passMark = parseInt(document.getElementById("passMark").value);
            const totalMarks = parseInt(document.getElementById("totalMarks").value);

            if (!subjectId) {
                showToast("Please choose a subject.", "error");
                return;
            }

            const qItems = document.querySelectorAll(".question-item");
            if (qItems.length === 0) {
                showToast("Please add at least one question.", "error");
                return;
            }

            const markPerQ = Math.max(1, Math.floor(totalMarks / qItems.length));
            const questions = [];

            qItems.forEach((item, idx) => {
                const text = item.querySelector(".q-text-input").value.trim();
                const optInputs = item.querySelectorAll(".q-opt-input");
                const radios = item.querySelectorAll("input[type='radio']");
                
                let selectedIndex = 0;
                radios.forEach((r, rIdx) => {
                    if (r.checked) selectedIndex = rIdx;
                });

                const options = [];
                optInputs.forEach((optIn, oIdx) => {
                    options.push({
                        option_text: optIn.value.trim() || `Option ${oIdx + 1}`,
                        is_correct: oIdx === selectedIndex
                    });
                });

                questions.push({
                    question_text: text,
                    marks: markPerQ,
                    question_order: idx + 1,
                    options: options
                });
            });

            const payload = {
                title: title,
                description: desc,
                subject_id: subjectId,
                difficulty: difficulty,
                duration_minutes: duration,
                pass_mark: passMark,
                total_marks: totalMarks,
                created_by: user.user_id,
                questions: questions
            };

            btn.disabled = true;
            btn.innerHTML = `<span>Saving to MySQL...</span>`;

            try {
                const res = await fetch(`${API}/create-exam`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`Exam "${title}" published successfully!`, "success");
                    document.getElementById("createExamForm").reset();
                    document.getElementById("questionsList").innerHTML = "";
                    questionCounter = 0;
                    addQuestionItem();
                    await loadExams();
                } else {
                    showToast(data.error || "Failed to publish exam.", "error");
                }
            } catch (err) {
                showToast("Server connection failure.", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Publish Exam to Portal`;
            }
        }
    </script>
</body>
</html>
